<!doctype html>
<html>
  <head>
    <!-- 页面元信息：字符编码 UTF-8，支持中文显示 -->
    <meta charset="utf-8">
    <title>Wanwan Chat</title>

    <!-- 样式区域：简单布局，不引入外部 CSS 框架 -->
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      /* 工具栏区域：放置录音按钮 */
      .toolbar { margin: 10px 0; }
      /* 录音按钮样式 */
      #record-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    </style>
  </head>

  <body>
    <!-- 页面标题 -->
    <h1>Wanwan Chat</h1>

    <!-- 工具栏区域：包含录音按钮 -->
    <div class="toolbar">
      <button id="record-btn">🎤 录音</button>
    </div>

    <!-- 状态显示区域：用于展示当前录音状态（录音中 / 已停止 / 错误信息） -->
    <div id="status"></div>

    <!-- 引入前端脚本：处理录音按钮的交互逻辑 -->
    <script src="/static/js/chat_page.js"></script>
  </body>
</html>
